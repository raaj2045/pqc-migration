# Minimum-viable CI for the paper artefacts. Builds the chain, runs its
# tests, and builds the standalone paper tools. Total wall time is well
# under 10 minutes.
#
# NOTE: benchmarks/crypto_micro and tools/presigner are not built here.
# Both import github.com/cosmos/cosmos-sdk/crypto/keys/mldsa via a
# `replace` onto the deleted cosmos/ fork. Stock SDK v0.55 ships
# crypto/keys/mldsa65 instead, so they need source changes (a different
# package and a different ML-DSA parameter set) rather than a dropped
# replace directive. Tracked with the paper rewrite.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true

      # The 08-wasm BLS verifier links against herumi/bls-eth-go-binary,
      # which needs libstdc++ at link time. See docs/getting-started.md.
      - name: install libstdc++
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++

      - name: build chain
        run: go build ./...

      - name: test chain
        run: go test ./...

      - name: smoke-test pqchaind
        run: |
          go build -o /tmp/pqchaind ./cmd/pqchaind
          /tmp/pqchaind version

  devnet-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Unit tests for the config layer's placeholder expansion
      # ($DEVNET_ROOT / $HOME / ~). Both files use only their standard
      # libraries, so nothing needs installing. Running the devnet itself
      # needs a live chain and is out of scope here.
      - name: test config layer
        run: |
          node devnet/lib/config.test.js
          python3 devnet/lib/config_test.py

  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.5"
          cache: true

      - name: build paper tools
        run: |
          cd tools/loadgen       && go build ./... && cd ../..
          cd tools/storage_sim   && go build ./... && cd ../..
          cd tools/block_packing && go build ./... && cd ../..
