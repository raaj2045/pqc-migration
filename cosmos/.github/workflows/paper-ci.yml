# Minimum-viable CI for the paper artefacts: build simd and run the crypto
# micro-benchmarks on every push so reviewers can verify the code compiles
# and the headline numbers reproduce without having to spin up a full local
# environment.
#
# Kept intentionally separate from the upstream Cosmos SDK workflows so the
# upstream test matrix isn't affected.
name: paper-ci

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "tools/**"
      - "crypto/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/paper-ci.yml"
  pull_request:
    branches: [main]

jobs:
  build-and-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.5"
          cache: true

      - name: build simd
        env:
          LEDGER_ENABLED: "false"
        run: make build

      - name: smoke-test simd
        run: ./build/simd version

      - name: crypto micro-benchmarks (short)
        working-directory: benchmarks/crypto_micro
        # -benchtime=1x keeps wall-time bounded in CI; paper-grade numbers
        # use the longer benchtime documented in REPRODUCE.md.
        run: go test -bench=. -benchmem -benchtime=1x -run=^$ ./...
