\* Bounded model for exhaustive checking.
\*
\* Two accounts and two event ids suffice for both properties: NoDoubleMint
\* needs one id reachable by two mints, and NoUnverifiedMint needs one credit.
\* Amounts include 0 to exercise the non-negative boundary the handler allows.

SPECIFICATION Spec

CONSTANTS
    Accounts = {a1, a2}
    EventIds = {e1, e2}
    Amounts  = {0, 1, 2}
    MaxBalance = 4
    MaxHistory = 4

CONSTRAINT StateConstraint

INVARIANT TypeOK
INVARIANT NoDoubleMint
INVARIANT NoUnverifiedMint
INVARIANT LockConserves
