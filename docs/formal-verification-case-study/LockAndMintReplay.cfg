\* Same model, with NoUnverifiedMint omitted.
\*
\* NoUnverifiedMint fails at depth 2, which halts the search before the state
\* space is exhausted. To establish NoDoubleMint over the *whole* reachable
\* space, the failing invariant has to be dropped from this run. It is checked
\* separately in LockAndMint.cfg; omitting it here weakens nothing.

SPECIFICATION Spec

CONSTANTS
    Accounts = {a1, a2}
    EventIds = {e1, e2}
    Amounts  = {0, 1, 2}
    MaxBalance = 4
    MaxHistory = 4

CONSTRAINT StateConstraint

INVARIANT TypeOK
INVARIANT NoDoubleMint
INVARIANT LockConserves
