# CI for the ethereum-lockandmint side of the bridge.
# Runs hardhat tests on every push/PR so reviewers can verify the contract +
# relayer code actually compiles and the unit tests pass without touching any
# physical hardware or external RPC.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: compile contracts
        run: npx hardhat compile

      - name: run tests
        run: npm test
        # The queue/metrics/worker tests in test/relayer_queue.test.js also
        # exercise the SQLite-backed durable queue — no external Cosmos
        # chain required, so CI stays self-contained.
